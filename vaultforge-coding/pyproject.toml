[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultforge-code"
version = "0.1.0"
description = "Local-first scaffolding for the VaultForge Code bridge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.75.0,<2",
  "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
]

[project.scripts]
vaultforge-code = "vf_code_bridge.cli:main"
vaultforge-tool = "vf_code_bridge.tool_runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
