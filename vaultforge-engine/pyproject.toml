[project]
name = "vaultforge-engine"
version = "0.1.0"
description = "Shared image-generation engine for VaultForge lanes."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["generate"]
